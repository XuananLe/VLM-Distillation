<?xml version="1.0"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">

<svg width="300" height="400"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink">
	<title>Square</title>
	<desc>Square</desc>
	<g transform="translate(70 330) scale(1 -1)">
		<g style="stroke: LightGrey; fill: none;">
			<rect x="-20" y="0" width="220" height="250"/>
			<line id="hl" x1="-25" y1="0" x2="200" y2="0"/>
			<use xlink:href="#hl" transform="translate(0 50)"/>
			<use xlink:href="#hl" transform="translate(0 100)"/>
			<use xlink:href="#hl" transform="translate(0 150)"/>
			<use xlink:href="#hl" transform="translate(0 200)"/>
			<line id="xtick" x1="20" y1="-5" x2="20" y2="0"/>
			<use xlink:href="#xtick" transform="translate(70 0)"/>
			<use xlink:href="#xtick" transform="translate(140 0)"/>
		</g>
		<g style="stroke: black;">
			<rect x="0" y="0" width="40" height="100" style="fill: DarkBlue"/>
			<rect x="70" y="0" width="40" height="250" style="fill: DeepSkyBlue"/>
			<rect x="140" y="0" width="40" height="150" style="fill: Blue"/>
		</g>
	</g>
	<g style="font-size: 14pt; text-anchor: middle">
		<text x="90" y="355"> 1 </text>
		<text x="160" y="355"> 2 </text>
		<text x="230" y="355"> 3 </text>
		<text x="35" y="335"> 0 </text>
		<text x="35" y="285"> 1 </text>
		<text x="35" y="235"> 2 </text>
		<text x="35" y="185"> 3 </text>
		<text x="35" y="135"> 4 </text>
		<text x="35" y="85"> 5 </text>
	</g>
</svg>